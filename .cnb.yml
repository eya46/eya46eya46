master:
  push:
    - services:
        - docker
      runner:
        cpus: 4
      stages:
        - name: Show Info
          script:
            - echo CNB_DOCKER_REGISTRY:${CNB_DOCKER_REGISTRY}
            - echo CNB_REPO_SLUG_LOWERCASE:${CNB_REPO_SLUG_LOWERCASE}
            - echo CNB_REPO_NAME:${CNB_REPO_NAME}
        - name: Docker Login
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: Docker Build
          script: |
            docker build \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH} \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT} \
              .
        - name: Docker Push
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH}
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}
        - name: Notify k3s
          script: |
            if [ -z "${DEPLOY_WEBHOOK_URL:-}" ] || [ -z "${DEPLOY_WEBHOOK_TOKEN:-}" ]; then
              echo "Deploy skipped: webhook is not configured"
              exit 0
            fi

            curl --fail-with-body --show-error --silent \
              --max-time 30 \
              --header "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"image\":\"${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}\"}" \
              "${DEPLOY_WEBHOOK_URL}"
            ATTEMPT=0
            while [ "${ATTEMPT}" -lt 90 ]; do
              HTTP_STATUS=$(curl --show-error --silent \
                --max-time 30 \
                --output /tmp/eya46eya46-deploy-status.json \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}" \
                "${DEPLOY_WEBHOOK_URL}/status/${CNB_COMMIT}") || exit 1

              case "${HTTP_STATUS}" in
                200)
                  cat /tmp/eya46eya46-deploy-status.json
                  exit 0
                  ;;
                202)
                  sleep 5
                  ;;
                *)
                  cat /tmp/eya46eya46-deploy-status.json
                  exit 1
                  ;;
              esac
              ATTEMPT=$((ATTEMPT + 1))
            done

            echo "Deployment status polling timed out"
            exit 1
